<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reeks 14 : Oefening 4</title>
    <link rel="stylesheet" href="./Oefening_14_4.css">
</head>
<body>
    <table>
        <tr>
            <td>Getal #</td>
            <td>Waarde</td>
        </tr>
        <script>
            var Sum = null,Getal,Counter = 0;
            Getal = parseInt(window.prompt("Geef een getal in AUB (Om te stoppen voer 0 in)")); 
            while (Getal != 0) {
                Counter += 1;
                Sum += Getal;
                document.write("<tr><td>Getal " + Counter  + "</td><td>" + Getal + "</td></tr>");
                Getal = parseInt(window.prompt("Geef een getal in AUB (Om te stoppen voer 0 in)")); 
            }
    
            document.write("<tr><td>Totaal</td><td>" + Sum + "</td></tr>");
            document.write("<tr><td>Gemiddelde</td><td>" + Sum/Counter + "</td></tr>");
    
        </script>
    </table>
</body>
</html>
