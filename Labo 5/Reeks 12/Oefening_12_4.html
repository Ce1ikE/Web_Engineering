<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reeks 12 : Oefening 4</title>
</head>
<body>
    <script>
        var Getal_1 = parseInt(window.prompt("Geef een getal in AUB")); 
        var Getal_2 = parseInt(window.prompt("Geef een ander getal in AUB"));
        var Rest = Getal_1 % Getal_2;
        var Quotient_INT = Math.floor(Getal_1 / Getal_2);
        var Quotient_REEL = Getal_1 / Getal_2;
        document.write("<p>");
        document.write("Gehele quotiënt = " + Quotient_INT + "<br/>");
        document.write("Rest = " + Rest + "<br/>");
        document.write("Reële quotiët = " + Quotient_REEL + "<br/>");
        document.write("</p>");
    </script>
</body>
</html>
