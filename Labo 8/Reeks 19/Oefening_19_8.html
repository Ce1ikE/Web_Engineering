<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reeks 19 : Oefening 8</title>
    <link href="./Oefening_19_8.css" rel="stylesheet" />  
</head>
<body>

	<div id="portfolio">
		<img src="../Startbestanden/startbestanden/images/slideshow/slideshow1.png" id="slideshow" alt="slideshow"/>
	</div>

    <div id="feedback">
        <img src="../Startbestanden/startbestanden/images/slideshow/loading.gif" id="loadingbar" alt="Loading_gif">
        <div id="bar"></div>
    </div>
       
    <div id="button">
    	<a href="#" id="startcycle">
        	<img id="btnCycle" src="../Startbestanden/startbestanden/images/slideshow/cyclebutton.png" />
        </a>
    </div>

    <script>
        var Image_Src = new Array(
                                "../Startbestanden/startbestanden/images/slideshow/slideshow1.png",
                                "../Startbestanden/startbestanden/images/slideshow/slideshow2.png",
                                "../Startbestanden/startbestanden/images/slideshow/slideshow3.png",
                                "../Startbestanden/startbestanden/images/slideshow/slideshow4.png"
                                );

        var Image_Element = document.getElementById("slideshow");
        var Button = document.getElementById("button");
        var Counter = 0;
        var slideshow_Active = false;
        var Load_Bar = document.getElementById("bar");
        var Width_Load_Bar = 0;

        Button.addEventListener("click",function(){
            if(slideshow_Active){
                slideshow_Active = false;
            } else {
                slideshow_Active = true;
                Slideshow();
            }
        });
        
        function Slideshow(){
            if(slideshow_Active){
                Counter = ((++Counter) % Image_Src.length);
                Image_Element.style.opacity = 0;
                setTimeout(function(){
                    Image_Element.setAttribute("src",Image_Src[Counter]);
                },1200);
                setTimeout(function(){
                    Image_Element.style.opacity = 1;
                },1500);
                Width_Load_Bar = 0;
                Load_Bar.style.width = Width_Load_Bar + "px";
                Change_Loadbar();
            }
        }
        
        function Change_Loadbar(){
            if(Width_Load_Bar == 700){
                Slideshow();
            } else {
                Width_Load_Bar += 5;
                Load_Bar.style.width = Width_Load_Bar + "px";
                setTimeout(Change_Loadbar,50);
            }
        }


    </script>
</body>
</html>
