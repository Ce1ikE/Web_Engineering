  <script>
    var Zon = document.getElementById("dag");
    var Maan = document.getElementById("nacht");
    var Cadeau_Icoon = document.getElementById("cadeau-icoon");
    var Kertboom_Icoon = document.getElementById("kerstboom-icoon");
    var Lichtjes = document.querySelectorAll("img[id^='blauw']");

    var Flikkeren_Active = false;

    Zon.addEventListener("click",function(){
        document.body.style.backgroundColor = "#0d9adb";
    });

    Maan.addEventListener("click",function(){
        document.body.style.backgroundColor = "#00001C";
    });

    Cadeau_Icoon.addEventListener("click",function(){
        for(let i = 0;i < Lichtjes.length;i++){
            Lichtjes[i].setAttribute("src","../Startbestanden/vraag3/images/lamp_blauw.png");
        }
        Flikkeren_Active = true;
        setTimeout(Flikker_Lichtjes,2000);
    });
    
    Kertboom_Icoon.addEventListener("click",function(){
        Flikkeren_Active = false;
    });

    function Flikker_Lichtjes(){
        if(Flikkeren_Active){
            setTimeout(function(){
                for(let i = 0;i < Lichtjes.length;i++){
                    Lichtjes[i].setAttribute("src","../Startbestanden/vraag3/images/lamp_blauw.png");
                }
            },0);
    
            setTimeout(function(){
                for(let i = 0;i < Lichtjes.length;i++){
                    Lichtjes[i].setAttribute("src","../Startbestanden/vraag3/images/lamp_uit.png");
                }
            },1000);
    
            setTimeout(Flikker_Lichtjes,1500);
        }
    }
  </script>
