    <script type="text/javascript">
        
        function navItemHover(){
            var navItem = document.getElementById("nav").getElementsByTagName("li");
            document.getElementById("nav").style.display = "flex";
            document.getElementById("nav").style.flexDirection = "column";
            var List_Item = document.getElementById("nav").getElementsByTagName("ul");
            for (let i = 0; i < List_Item.length; i++) {
                List_Item[i].style.marginLeft = "9em";
            }
            
            for (var i=0; i<navItem.length; i++){
                navItem[i].onmouseover=function() {this.className+=" zweven";}
                navItem[i].onmouseout=function() {this.className=this.className.replace(new RegExp(" zweven\\b"), "");}
            }
        }
        if (window.attachEvent) window.attachEvent("onload", NavItemHover);

    </script>
