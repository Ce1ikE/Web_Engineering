<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reeks 17 : Oefening 2</title>
    <link rel="stylesheet" href="./Oefening_17_2.css">
    <script>
        var Timer;
        var Time_Now = new Date();
        // Time_Now.setTime(-1000 * 60 * 60 + 1000 * 11);
        Time_Now.setHours(0);
        Time_Now.setMinutes(0);
        Time_Now.setSeconds(10);

        function Start_Stopwatch() {
            Timer = window.setInterval("Display_Stopwatch()",1000);
        }

        function Display_Stopwatch() {
            if (Time_Now.getSeconds().toLocaleString() == 0) {
                window.clearInterval(Timer);
                Time_Now = new Date();
                Time_Now.setHours(0);
                Time_Now.setMinutes(0);
                Time_Now.setSeconds(10);
                document.getElementById("Stopwatch").innerHTML = "00 : 00 : 10";
                window.alert("Time's up!!");
            } else {
                Time_Now.setTime(Time_Now.getTime() - 1000);
                document.getElementById("Stopwatch").innerHTML = Time_Now.getHours().toLocaleString().padStart(2,"0") + " : " + Time_Now.getMinutes().toLocaleString().padStart(2,"0") + " : " + Time_Now.getSeconds().toLocaleString().padStart(2,"0");
            }
        }
        
        function Stop_Stopwatch() {
            window.clearInterval(Timer);
        }
    </script>
</head>
<body">
    <div class="stopwatch-container">
        <p id="Stopwatch">00 : 00 : 10</p>

        <div class="button-container">
            <input type="button" value="Start stopwatch" id="Start_Btn" onclick="Start_Stopwatch();">
            <input type="button" value="Stop stopwatch" id="Stop_Btn" onclick="Stop_Stopwatch();">
        </div>
    </div>


</body>
</html>
